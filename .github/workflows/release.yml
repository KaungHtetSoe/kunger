name: Release

# Builds the AppImage and .deb bundles and attaches them to a GitHub
# Release. Triggered by pushing a `v*` tag (e.g. `v0.1.0`), matching
# `package.json`'s and `tauri.conf.json`'s `version` field.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish Linux bundles
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            pkg-config \
            file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and (on a tag push) publish AppImage + .deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kunger ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb
